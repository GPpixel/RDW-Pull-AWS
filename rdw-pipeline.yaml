AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Weekly RDW open data download into DynamoDB. A scheduled Fargate task downloads the CSV,
  checks it's complete, uploads it to S3, imports it into a new DynamoDB table, then points
  the SSM parameter <ParamPrefix>/current-table at that table and deletes older tables.
  Emails AlertEmail if a run fails, if no healthy run happens for AlertAfterDays, or if RDW's
  API announces a deprecation.

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC for the task (the default VPC is fine).
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Public subnets in that VPC. The task gets a public IP to reach RDW, so no NAT gateway is needed.
  ScheduleExpression:
    Type: String
    Default: cron(30 4 ? * MON *)
    Description: When to run (EventBridge Scheduler syntax), in Europe/London time. Default is weekly, Mondays at 04:30.
  DatasetId:
    Type: String
    Default: m9d7-ebf2
    Description: RDW dataset ID (m9d7-ebf2 = Gekentekende_voertuigen).
  KeyAttribute:
    Type: String
    Default: Kenteken
    Description: CSV column to use as the table key. Must match the CSV header exactly (case-sensitive).
  TablePrefix:
    Type: String
    Default: rdw-vehicles
    AllowedPattern: '[a-zA-Z0-9_.-]+'
    Description: Each import creates a table named <prefix>-<UTC timestamp>.
  KeepTables:
    Type: Number
    Default: 2
    MinValue: 1
    Description: How many of the newest tables to keep (2 = the live one plus one to fall back to).
  ParamPrefix:
    Type: String
    Default: /rdw
    AllowedPattern: '/[a-zA-Z0-9_./-]*[a-zA-Z0-9_.-]'
    Description: SSM parameter path. <prefix>/current-table holds the live table name, <prefix>/current-source-file the RDW file it came from.
  AlertEmail:
    Type: String
    Default: ''
    Description: Email address for alerts (failed runs, no healthy run for AlertAfterDays, RDW deprecation notices). AWS sends a confirmation email first - click the link in it.
  AlertAfterDays:
    Type: Number
    Default: 8
    MinValue: 1
    Description: Email if no healthy run has happened for this many days (checked daily). Keep it above the schedule's interval - 8 suits a weekly schedule.

Conditions:
  HasAlertEmail: !Not [!Equals [!Ref AlertEmail, '']]

Resources:
  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      DisplayName: RDW pipeline

  AlertSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlertEmail
    Properties:
      TopicArn: !Ref AlertTopic
      Protocol: email
      Endpoint: !Ref AlertEmail

  AlertTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics: [!Ref AlertTopic]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowEventBridge
            Effect: Allow
            Principal: { Service: events.amazonaws.com }
            Action: sns:Publish
            Resource: !Ref AlertTopic

  DataBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: ExpireOldDownloads
            Status: Enabled
            ExpirationInDays: 7
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1

  Cluster:
    Type: AWS::ECS::Cluster

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /ecs/${AWS::StackName}
      RetentionInDays: 30

  TaskSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: RDW pipeline task - outbound only
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - IpProtocol: '-1'
          CidrIp: 0.0.0.0/0

  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: rdw-pipeline
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: Bucket
                Effect: Allow
                Action: [s3:PutObject, s3:GetObject]
                Resource: !Sub ${DataBucket.Arn}/*
              - Sid: BucketList
                Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt DataBucket.Arn
              - Sid: Tables
                Effect: Allow
                Action:
                  - dynamodb:ImportTable
                  - dynamodb:DescribeImport
                  - dynamodb:CreateTable
                  - dynamodb:DescribeTable
                  - dynamodb:DeleteTable
                Resource: !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${TablePrefix}-*
              - Sid: ListTables
                Effect: Allow
                Action: dynamodb:ListTables
                Resource: '*'
              - Sid: Params
                Effect: Allow
                Action: [ssm:GetParameter, ssm:PutParameter]
                Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${ParamPrefix}/*
              - Sid: ImportErrorLogs
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:DescribeLogStreams
                  - logs:PutLogEvents
                  - logs:PutRetentionPolicy
                Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws-dynamodb/*
              - Sid: ImportErrorLogsDescribe
                Effect: Allow
                Action: logs:DescribeLogGroups
                Resource: '*'
              - Sid: DeprecationEmail
                Effect: Allow
                Action: sns:Publish
                Resource: !Ref AlertTopic

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub ${AWS::StackName}-pipeline
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: '1024'
      Memory: '2048'
      EphemeralStorage:
        SizeInGiB: 30
      RuntimePlatform:
        OperatingSystemFamily: LINUX
        CpuArchitecture: X86_64
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: pipeline
          Image: public.ecr.aws/aws-cli/aws-cli:latest
          Essential: true
          EntryPoint: [/bin/bash, -c]
          Environment:
            - { Name: BUCKET, Value: !Ref DataBucket }
            - { Name: DATASET, Value: !Ref DatasetId }
            - { Name: KEY_ATTR, Value: !Ref KeyAttribute }
            - { Name: TABLE_PREFIX, Value: !Ref TablePrefix }
            - { Name: KEEP_TABLES, Value: !Ref KeepTables }
            - { Name: PARAM_PREFIX, Value: !Ref ParamPrefix }
            - { Name: AWS_DEFAULT_REGION, Value: !Ref AWS::Region }
            - { Name: TOPIC_ARN, Value: !Ref AlertTopic }
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: run
          Command:
            - |
              set -euo pipefail
              log() { echo "$(date -u '+%Y-%m-%d %H:%M:%S') $*"; }

              : "${BUCKET:?}" "${DATASET:?}" "${TABLE_PREFIX:?}" "${KEY_ATTR:?}" "${PARAM_PREFIX:?}"
              KEEP_TABLES="${KEEP_TABLES:-2}"
              BASE="${RDW_BASE:-https://opendata.rdw.nl}"
              WORK="${WORK:-/tmp/rdw}"
              mkdir -p "$WORK"

              # Record a healthy run: a daily check emails you if none happens for AlertAfterDays
              heartbeat() {
                aws ssm put-parameter --name "$PARAM_PREFIX/last-healthy-run" --value "$(date -u +%s)" \
                  --type String --overwrite >/dev/null 2>&1 || log "Couldn't record the healthy run."
              }

              # Deprecation watch: collect any Deprecation/Sunset headers RDW sends, and email them
              # once (again only if the notice changes), however the run ends.
              DEPRECATIONS=""
              check_deprecation() {  # $1 = response headers file, $2 = which request it was
                local found
                if [[ "$DEPRECATIONS" == *"$2"* ]]; then return 0; fi
                found=$(grep -iE '^(deprecation|sunset):|^link:.*rel="?(deprecation|sunset)' "$1" 2>/dev/null \
                  | tr -d '\r' | sort -u || true)
                if grep -qiE '^(deprecation|sunset):' <<<"$found"; then
                  DEPRECATIONS+="$2"$'\n'"$found"$'\n\n'
                fi
              }
              notify_deprecations() {
                local sig prev msg
                if [[ -z "$DEPRECATIONS" ]]; then return 0; fi
                log "WARNING: RDW says part of its API is deprecated:"
                printf '%s' "$DEPRECATIONS" | sed 's/^/    /'
                sig=$(printf '%s' "$DEPRECATIONS" | md5sum | cut -d' ' -f1)
                prev=$(aws ssm get-parameter --name "$PARAM_PREFIX/deprecation-notice" --query Parameter.Value --output text 2>/dev/null || echo none)
                if [[ "$sig" == "$prev" || -z "${TOPIC_ARN:-}" ]]; then return 0; fi
                msg=$(printf 'The RDW API sent deprecation notices during the pipeline run on %s.\n\nThe pipeline may stop working after the sunset date, so it needs updating before then. You will only get this email again if the notice changes.\n\n%s' \
                  "$(date -u '+%Y-%m-%d %H:%M UTC')" "$DEPRECATIONS")
                if aws sns publish --topic-arn "$TOPIC_ARN" --subject "RDW API deprecation notice" --message "$msg" >/dev/null; then
                  aws ssm put-parameter --name "$PARAM_PREFIX/deprecation-notice" --value "$sig" --type String --overwrite >/dev/null || true
                else
                  log "Couldn't send the deprecation email."
                fi
              }
              trap notify_deprecations EXIT

              # The AWS CLI image is minimal: install curl/gzip if it lacks them
              missing=""
              for t in curl gzip; do command -v "$t" >/dev/null 2>&1 || missing="$missing $t"; done
              if [[ -n "$missing" ]]; then
                log "Installing:$missing"
                (dnf -y -q install curl-minimal gzip || yum -y -q install curl gzip) >/dev/null
              fi

              # 1. Has RDW published new data since the last import?
              #    The dataset's metadata gives its update time and name. If RDW ever stops serving it,
              #    the pipeline carries on regardless; it just can't skip days when nothing changed.
              meta=$(curl -fsS --retry 3 -D "$WORK/h_meta.txt" "$BASE/api/views/$DATASET.json" || true)
              check_deprecation "$WORK/h_meta.txt" "Dataset metadata: $BASE/api/views/$DATASET.json"
              updated=$(grep -oE '"rowsUpdatedAt"[[:space:]]*:[[:space:]]*[0-9]+' <<<"$meta" | grep -oE '[0-9]+$' || true)
              view_name=$(grep -oE '"name"[[:space:]]*:[[:space:]]*"[^"]*"' <<<"$meta" | head -1 \
                | sed -E 's/^"name"[[:space:]]*:[[:space:]]*"(.*)"$/\1/' || true)
              if [[ "$updated" =~ ^[0-9]+$ ]]; then
                last=$(aws ssm get-parameter --name "$PARAM_PREFIX/last-updated" --query Parameter.Value --output text 2>/dev/null || echo none)
                if [[ "$last" == "$updated" && "${FORCE:-0}" != "1" ]]; then
                  log "RDW data unchanged since the last import. Nothing to do."; heartbeat; exit 0
                fi
              else
                updated=""
                log "Couldn't read RDW's update time, so downloading anyway."
              fi

              # 2. How many rows should a complete download have?
              expected=$(curl -fsS --retry 3 -D "$WORK/h_count.txt" "$BASE/resource/$DATASET.json?\$select=count(*)" \
                | grep -oE '"[0-9]+"' | tr -d '"' || true)
              check_deprecation "$WORK/h_count.txt" "Row count: $BASE/resource/$DATASET.json"
              if [[ ! "$expected" =~ ^[0-9]+$ ]]; then
                log "Couldn't get the row count from RDW."; exit 1
              fi
              min_rows=$(( expected * 999 / 1000 ))
              log "RDW reports $expected rows."

              # 3. Download, gzipping on the fly (the uncompressed CSV never touches disk).
              #    A download that ends early - with or without an error - fails the row check and is retried.
              #    --max-time is a safety cap (4h) so a connection that hangs without closing can't run forever.
              #    This is the SODA3 full export: public datasets need no app token for it.
              gz="$WORK/$DATASET.csv.gz"
              ok=0
              for attempt in 1 2 3; do
                log "Download attempt $attempt..."
                if curl -fsSL --keepalive-time 60 --max-time 14400 -D "$WORK/h_export.txt" \
                     "$BASE/api/v3/views/$DATASET/export.csv" | gzip > "$gz"; then
                  check_deprecation "$WORK/h_export.txt" "CSV export: $BASE/api/v3/views/$DATASET/export.csv"
                  lines=$(gzip -dc "$gz" | wc -l) || lines=0
                  rows=$(( lines - 1 ))
                  log "Got $rows rows ($(du -h "$gz" | cut -f1) compressed)."
                  if (( rows >= min_rows )); then ok=1; break; fi
                  log "That's fewer rows than RDW reports, so the download was cut short."
                else
                  check_deprecation "$WORK/h_export.txt" "CSV export: $BASE/api/v3/views/$DATASET/export.csv"
                  log "Download failed."
                fi
                if (( attempt < 3 )); then sleep 120; fi
              done
              if (( ! ok )); then log "Giving up: no complete download after 3 attempts."; exit 1; fi

              # Name the file exactly as the portal's Export button does: the dataset name made file-safe
              # plus the download date, e.g. Open_Data_RDW__Gekentekende_voertuigen_20261021.csv.
              # (RDW's own update time is kept in the S3 object metadata and <ParamPrefix>/last-updated.)
              base=$(printf '%s' "$view_name" | tr -c 'A-Za-z0-9._-' '_')
              if [[ -z "$base" || "$base" == .* ]]; then base="$DATASET"; fi
              src_name="${base}_$(date -u +%Y%m%d).csv"
              log "File name: $src_name"

              # 4. The table key must match a CSV column exactly (case-sensitive)
              header=$(gzip -dc "$gz" 2>/dev/null | head -1 | tr -d '\r"' | sed 's/^\xEF\xBB\xBF//' || true)
              found=0
              IFS=, read -ra cols <<<"$header"
              for c in "${cols[@]}"; do
                if [[ "$c" == "$KEY_ATTR" ]]; then found=1; fi
              done
              if (( ! found )); then
                log "Column '$KEY_ATTR' isn't in the CSV header. Header is: $header"; exit 1
              fi

              # 5. Upload to S3
              stamp=$(date -u +%Y%m%d-%H%M%S)
              table="${TABLE_PREFIX}-${stamp}"
              prefix="imports/${DATASET}/${stamp}/"
              log "Uploading to s3://$BUCKET/${prefix}${src_name}.gz"
              aws s3 cp "$gz" "s3://$BUCKET/${prefix}${src_name}.gz" --only-show-errors \
                --metadata "rdw-rows-updated-at=${updated:-unknown},rdw-row-count=$rows"

              # 6. Import into a brand-new table
              log "Starting import into $table..."
              arn=$(aws dynamodb import-table \
                --s3-bucket-source "S3Bucket=$BUCKET,S3KeyPrefix=$prefix" \
                --input-format CSV --input-compression-type GZIP \
                --table-creation-parameters "{\"TableName\":\"$table\",\"KeySchema\":[{\"AttributeName\":\"$KEY_ATTR\",\"KeyType\":\"HASH\"}],\"AttributeDefinitions\":[{\"AttributeName\":\"$KEY_ATTR\",\"AttributeType\":\"S\"}],\"BillingMode\":\"PAY_PER_REQUEST\"}" \
                --query ImportTableDescription.ImportArn --output text)

              while :; do
                sleep "${POLL_SECONDS:-60}"
                status=$(aws dynamodb describe-import --import-arn "$arn" --query ImportTableDescription.ImportStatus --output text)
                case "$status" in
                  COMPLETED) break ;;
                  FAILED|CANCELLED)
                    reason=$(aws dynamodb describe-import --import-arn "$arn" --output text \
                      --query '[ImportTableDescription.FailureCode, ImportTableDescription.FailureMessage]' || true)
                    log "Import $status: $reason"
                    aws dynamodb delete-table --table-name "$table" >/dev/null 2>&1 || true
                    exit 1 ;;
                  *) log "Import status: $status" ;;
                esac
              done

              counts=$(aws dynamodb describe-import --import-arn "$arn" --output text \
                --query '[ImportTableDescription.ImportedItemCount, ImportTableDescription.ErrorCount]')
              read -r imported errors <<<"$counts"
              imported=${imported//[^0-9]/}; imported=${imported:-0}
              log "Imported $imported items (errors: $errors)."
              if (( imported < min_rows )); then
                log "Too few items imported. Keeping the current table and deleting $table."
                aws dynamodb delete-table --table-name "$table" >/dev/null 2>&1 || true
                exit 1
              fi

              # 7. Point apps at the new table
              aws ssm put-parameter --name "$PARAM_PREFIX/current-table" --value "$table" --type String --overwrite >/dev/null
              aws ssm put-parameter --name "$PARAM_PREFIX/current-source-file" --value "$src_name" --type String --overwrite >/dev/null
              if [[ -n "$updated" ]]; then
                aws ssm put-parameter --name "$PARAM_PREFIX/last-updated" --value "$updated" --type String --overwrite >/dev/null
              fi
              log "Switched $PARAM_PREFIX/current-table to $table (from $src_name)."

              # 8. Delete older tables, keeping the newest $KEEP_TABLES (the new one plus a previous one to fall back to)
              old=$(aws dynamodb list-tables --query "TableNames[?starts_with(@, '${TABLE_PREFIX}-')]" --output text \
                | tr '\t' '\n' | sort | head -n -"$KEEP_TABLES" || true)
              for t in $old; do
                if [[ "$t" == "$table" ]]; then continue; fi
                log "Deleting old table $t"
                aws dynamodb delete-table --table-name "$t" >/dev/null
              done
              heartbeat
              log "Done."

  SchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: scheduler.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: run-pipeline-task
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ecs:RunTask
                Resource: !Ref TaskDefinition
              - Effect: Allow
                Action: iam:PassRole
                Resource: [!GetAtt ExecutionRole.Arn, !GetAtt TaskRole.Arn]
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt StaleCheckFunction.Arn

  Schedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Description: Weekly RDW download and DynamoDB import
      ScheduleExpression: !Ref ScheduleExpression
      ScheduleExpressionTimezone: Europe/London
      FlexibleTimeWindow:
        Mode: FLEXIBLE
        MaximumWindowInMinutes: 30
      Target:
        Arn: !GetAtt Cluster.Arn
        RoleArn: !GetAtt SchedulerRole.Arn
        RetryPolicy:
          MaximumRetryAttempts: 2
        EcsParameters:
          TaskDefinitionArn: !Ref TaskDefinition
          LaunchType: FARGATE
          PlatformVersion: LATEST
          NetworkConfiguration:
            AwsvpcConfiguration:
              Subnets: !Ref SubnetIds
              SecurityGroups: [!Ref TaskSecurityGroup]
              AssignPublicIp: ENABLED

  FailedRunRule:
    Type: AWS::Events::Rule
    Properties:
      Description: Email when a pipeline run ends with an error
      EventPattern:
        source: [aws.ecs]
        detail-type: [ECS Task State Change]
        detail:
          clusterArn: [!GetAtt Cluster.Arn]
          lastStatus: [STOPPED]
          containers:
            exitCode: [{ anything-but: 0 }]
      Targets:
        - Id: email
          Arn: !Ref AlertTopic
          InputTransformer:
            InputPathsMap:
              exit: $.detail.containers[0].exitCode
              reason: $.detail.stoppedReason
              task: $.detail.taskArn
            InputTemplate: !Sub >-
              "The RDW pipeline run failed (exit code <exit>: <reason>). Nothing was changed, so
              apps keep using the previous table. The run's output is in CloudWatch Logs, log
              group ${LogGroup}. Task: <task>"

  FailedToStartRule:
    Type: AWS::Events::Rule
    Properties:
      Description: Email when a pipeline run couldn't start
      EventPattern:
        source: [aws.ecs]
        detail-type: [ECS Task State Change]
        detail:
          clusterArn: [!GetAtt Cluster.Arn]
          lastStatus: [STOPPED]
          stopCode: [TaskFailedToStart]
      Targets:
        - Id: email
          Arn: !Ref AlertTopic
          InputTransformer:
            InputPathsMap:
              reason: $.detail.stoppedReason
              task: $.detail.taskArn
            InputTemplate: >-
              "The RDW pipeline run couldn't start: <reason>. Nothing was changed, so apps keep
              using the previous table. Task: <task>"

  StaleCheckRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: stale-check
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [ssm:GetParameter, ssm:PutParameter]
                Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${ParamPrefix}/last-healthy-run
              - Effect: Allow
                Action: sns:Publish
                Resource: !Ref AlertTopic

  # Runs daily: emails if no healthy run has been recorded for AlertAfterDays.
  # The first check after deploying starts the clock, so a pipeline that never runs is caught too.
  StaleCheckFunction:
    Type: AWS::Lambda::Function
    Properties:
      Description: Emails if the RDW pipeline hasn't had a healthy run for AlertAfterDays
      Runtime: python3.12
      Handler: index.handler
      Timeout: 30
      Role: !GetAtt StaleCheckRole.Arn
      Environment:
        Variables:
          PARAM_NAME: !Sub ${ParamPrefix}/last-healthy-run
          TOPIC_ARN: !Ref AlertTopic
          ALERT_AFTER_DAYS: !Ref AlertAfterDays
          LOG_GROUP: !Ref LogGroup
      Code:
        ZipFile: |
          import os
          import time

          import boto3

          ssm = boto3.client("ssm")
          sns = boto3.client("sns")


          def handler(event, context):
              name = os.environ["PARAM_NAME"]
              limit = float(os.environ["ALERT_AFTER_DAYS"])
              now = int(time.time())
              try:
                  last = int(ssm.get_parameter(Name=name)["Parameter"]["Value"])
              except ssm.exceptions.ParameterNotFound:
                  # First check after deploying: start the clock now
                  ssm.put_parameter(Name=name, Value=str(now), Type="String", Overwrite=True)
                  return {"status": "clock started"}
              days = (now - last) / 86400
              if days <= limit:
                  return {"status": "ok", "days_since_healthy_run": round(days, 1)}
              sns.publish(
                  TopicArn=os.environ["TOPIC_ARN"],
                  Subject="RDW pipeline hasn't run",
                  Message=(
                      f"There has been no healthy RDW pipeline run for {days:.1f} days (the alert threshold "
                      f"is {limit:g} days), so the data in DynamoDB may be going stale. The task may not be "
                      f"starting at all: check the schedule and the log group {os.environ['LOG_GROUP']}. "
                      "You'll get this email once a day until a run succeeds."
                  ),
              )
              return {"status": "alerted", "days_since_healthy_run": round(days, 1)}

  StaleCheckSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Description: Daily check that the RDW pipeline is still running
      ScheduleExpression: cron(15 12 * * ? *)
      ScheduleExpressionTimezone: Europe/London
      FlexibleTimeWindow:
        Mode: 'OFF'
      Target:
        Arn: !GetAtt StaleCheckFunction.Arn
        RoleArn: !GetAtt SchedulerRole.Arn

Outputs:
  AlertTopicArn:
    Description: SNS topic the alerts go to (subscribe more addresses here if needed)
    Value: !Ref AlertTopic
  BucketName:
    Value: !Ref DataBucket
  CurrentTableParameter:
    Description: SSM parameter holding the live table name - read this from your app
    Value: !Sub ${ParamPrefix}/current-table
  CurrentSourceFileParameter:
    Description: SSM parameter holding the RDW file name the live table was built from
    Value: !Sub ${ParamPrefix}/current-source-file
  LogGroupName:
    Description: CloudWatch log group with each run's output
    Value: !Ref LogGroup
  RunNowCommand:
    Description: Start a run now instead of waiting for the schedule
    Value: !Sub
      - >-
        aws ecs run-task --cluster ${Cluster} --task-definition ${TaskDefinition} --launch-type FARGATE
        --network-configuration "awsvpcConfiguration={subnets=[${Subnets}],securityGroups=[${TaskSecurityGroup}],assignPublicIp=ENABLED}"
      - Subnets: !Join [',', !Ref SubnetIds]
